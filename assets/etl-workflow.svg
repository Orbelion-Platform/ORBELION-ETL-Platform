<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900" role="img" aria-labelledby="title desc">
  <title id="title">ORBELION ETL Platform workflow</title>
  <desc id="desc">Operational sources flow through extraction, metadata-driven transformation and validation, staging and loading, into SQL Server or Azure SQL for analytics and applications.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#03070d"/>
      <stop offset="0.55" stop-color="#07111f"/>
      <stop offset="1" stop-color="#0b1b33"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101d31" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#0a1424" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="process" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#132947"/>
      <stop offset="1" stop-color="#0b1728"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.5" stop-color="#7aa8ff"/>
      <stop offset="1" stop-color="#b58cff"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#7aa8ff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#7aa8ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#8bb7ff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L10 5L0 10Z" fill="#8ab4f8"/>
    </marker>
    <style>
      .eyebrow{font:600 13px Inter,Segoe UI,Arial,sans-serif;letter-spacing:2.6px;fill:#8ea5c4}
      .title{font:700 36px Inter,Segoe UI,Arial,sans-serif;fill:#f4f8ff}
      .subtitle{font:400 16px Inter,Segoe UI,Arial,sans-serif;fill:#9eb1cb}
      .step{font:700 12px Inter,Segoe UI,Arial,sans-serif;letter-spacing:1.8px;fill:#7fdcf2}
      .label{font:650 20px Inter,Segoe UI,Arial,sans-serif;fill:#f5f8ff}
      .small{font:400 14px Inter,Segoe UI,Arial,sans-serif;fill:#9eb1cb}
      .sourceTitle{font:650 17px Inter,Segoe UI,Arial,sans-serif;fill:#edf4ff}
      .sourceMeta{font:500 11px Inter,Segoe UI,Arial,sans-serif;letter-spacing:1.1px;fill:#7f9bbb}
      .card{fill:url(#card);stroke:#263b57;stroke-width:1.2}
      .processCard{fill:url(#process);stroke:#456b9f;stroke-width:1.3}
      .flow{fill:none;stroke:#7197c8;stroke-width:1.6;stroke-opacity:.9;marker-end:url(#arrow)}
      .flowDash{fill:none;stroke:#72b6d9;stroke-width:1.4;stroke-dasharray:6 7;stroke-opacity:.75}
      .icon{fill:none;stroke:#d8e8ff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
      .iconFill{fill:#d8e8ff}
    </style>
  </defs>

  <rect width="1800" height="900" fill="url(#background)"/>
  <rect width="1800" height="900" fill="url(#grid)"/>
  <ellipse cx="950" cy="435" rx="720" ry="390" fill="url(#glow)" opacity="0.35"/>

  <g transform="translate(56 52)">
    <text class="eyebrow" x="0" y="0">ORBELION / DATA ENGINEERING</text>
    <text class="title" x="0" y="48">ETL Platform Workflow</text>
    <text class="subtitle" x="0" y="82">Metadata-driven ingestion to analytical data products</text>
  </g>
  <g transform="translate(1452 58)">
    <rect width="292" height="42" rx="21" fill="#0d1b2f" stroke="#314b6e"/>
    <circle cx="24" cy="21" r="5" fill="#67e8f9" filter="url(#softGlow)"/>
    <text class="small" x="42" y="26">Public portfolio architecture</text>
  </g>
  <path d="M56 158H1744" stroke="#2a3c55"/>

  <text class="step" x="58" y="202">01 / DATA SOURCES</text>
  <text class="step" x="458" y="202">02 / INGESTION</text>
  <text class="step" x="750" y="202">03 / PROCESSING</text>
  <text class="step" x="1060" y="202">04 / LOADING</text>
  <text class="step" x="1350" y="202">05 / WAREHOUSE</text>
  <text class="step" x="1604" y="202">06 / CONSUMPTION</text>

  <!-- Data sources -->
  <g transform="translate(58 232)">
    <rect class="card" width="310" height="92" rx="12"/>
    <g transform="translate(24 24)">
      <circle class="icon" cx="22" cy="22" r="17"/>
      <circle cx="22" cy="22" r="6" fill="#7aa8ff"/>
    </g>
    <text class="sourceMeta" x="84" y="33">ERP CONNECTOR</text>
    <text class="sourceTitle" x="84" y="61">Odoo XML-RPC</text>
  </g>
  <g transform="translate(58 346)">
    <rect class="card" width="310" height="92" rx="12"/>
    <g transform="translate(24 23)">
      <path class="icon" d="M15 8L6 22l9 14M31 8l9 14-9 14M20 32l6-20"/>
    </g>
    <text class="sourceMeta" x="84" y="33">EXTERNAL SYSTEMS</text>
    <text class="sourceTitle" x="84" y="61">REST APIs</text>
  </g>
  <g transform="translate(58 460)">
    <rect class="card" width="310" height="92" rx="12"/>
    <g transform="translate(24 21)">
      <ellipse class="icon" cx="22" cy="10" rx="17" ry="7"/>
      <path class="icon" d="M5 10v25c0 4 8 7 17 7s17-3 17-7V10M5 23c0 4 8 7 17 7s17-3 17-7"/>
    </g>
    <text class="sourceMeta" x="84" y="33">RELATIONAL DATA</text>
    <text class="sourceTitle" x="84" y="61">SQL Sources</text>
  </g>
  <g transform="translate(58 574)">
    <rect class="card" width="310" height="92" rx="12"/>
    <g transform="translate(24 22)">
      <rect class="icon" x="5" y="4" width="34" height="36" rx="3"/>
      <path class="icon" d="M5 16h34M16 4v36M27 16v24M5 28h34"/>
    </g>
    <text class="sourceMeta" x="84" y="33">FILE INGESTION</text>
    <text class="sourceTitle" x="84" y="61">CSV / Excel</text>
  </g>

  <!-- Source convergence -->
  <path class="flow" d="M368 278C410 278 410 365 448 376"/>
  <path class="flow" d="M368 392C408 392 410 390 448 390"/>
  <path class="flow" d="M368 506C410 506 410 420 448 405"/>
  <path class="flow" d="M368 620C420 620 412 450 448 420"/>

  <!-- Processing -->
  <g transform="translate(458 326)">
    <rect class="processCard" width="224" height="146" rx="16"/>
    <circle cx="40" cy="42" r="22" fill="#0d1a2b" stroke="#5b82b5"/>
    <path class="icon" d="M28 35h24M28 42h16M28 49h20M51 33l7 9-7 9"/>
    <text class="label" x="24" y="92">Extract</text>
    <text class="small" x="24" y="118">Connector registry</text>
  </g>
  <path class="flow" d="M682 399H738"/>
  <g transform="translate(750 326)">
    <rect class="processCard" width="246" height="146" rx="16"/>
    <circle cx="40" cy="42" r="22" fill="#0d1a2b" stroke="#5b82b5"/>
    <path class="icon" d="M28 35h24M28 49h24M34 29v12M46 43v12"/>
    <text class="label" x="24" y="92">Transform &amp; Validate</text>
    <text class="small" x="24" y="118">Pandas + YAML rules</text>
  </g>
  <path class="flow" d="M996 399H1048"/>
  <g transform="translate(1060 326)">
    <rect class="processCard" width="224" height="146" rx="16"/>
    <circle cx="40" cy="42" r="22" fill="#0d1a2b" stroke="#5b82b5"/>
    <path class="icon" d="M40 27v24M31 42l9 9 9-9M28 57h24"/>
    <text class="label" x="24" y="92">Stage &amp; Load</text>
    <text class="small" x="24" y="118">Transactional contracts</text>
  </g>
  <path class="flow" d="M1284 399H1338"/>

  <!-- Warehouse -->
  <g transform="translate(1350 274)">
    <rect class="processCard" width="214" height="252" rx="16"/>
    <ellipse class="icon" cx="107" cy="52" rx="35" ry="14"/>
    <path class="icon" d="M72 52v52c0 8 16 14 35 14s35-6 35-14V52M72 78c0 8 16 14 35 14s35-6 35-14"/>
    <text class="label" x="28" y="156">SQL Server</text>
    <text class="label" x="28" y="182">/ Azure SQL</text>
    <path d="M28 204H186" stroke="#314b6e"/>
    <text class="small" x="28" y="228">Staging → Dimensions → Facts</text>
  </g>
  <path class="flow" d="M1564 399H1592"/>

  <!-- Consumers -->
  <g transform="translate(1604 326)">
    <rect class="processCard" width="140" height="146" rx="16"/>
    <g transform="translate(24 24)">
      <rect class="iconFill" x="0" y="24" width="10" height="18" rx="2"/>
      <rect class="iconFill" x="17" y="14" width="10" height="28" rx="2"/>
      <rect class="iconFill" x="34" y="2" width="10" height="40" rx="2"/>
    </g>
    <text class="label" x="24" y="92">Analytics</text>
    <text class="small" x="24" y="118">Applications</text>
  </g>

  <!-- Control plane -->
  <g transform="translate(458 588)">
    <rect x="0" y="0" width="826" height="126" rx="14" fill="#091525" stroke="#2f4665" stroke-dasharray="5 6"/>
    <text class="step" x="24" y="32">CONTROL PLANE</text>
    <g transform="translate(24 52)">
      <rect width="224" height="50" rx="9" fill="#10223a" stroke="#36577e"/>
      <path class="icon" d="M18 13h16M18 25h16M18 37h11"/>
      <text class="small" x="48" y="31">YAML metadata</text>
    </g>
    <g transform="translate(296 52)">
      <rect width="230" height="50" rx="9" fill="#10223a" stroke="#36577e"/>
      <path class="icon" d="M18 34V17M18 34h18M22 29l6-7 6 3"/>
      <text class="small" x="50" y="31">Audit &amp; observability</text>
    </g>
    <g transform="translate(574 52)">
      <rect width="228" height="50" rx="9" fill="#10223a" stroke="#36577e"/>
      <path class="icon" d="M18 15v22M12 21l6-6 6 6M32 15v22M26 31l6 6 6-6"/>
      <text class="small" x="50" y="31">Watermarks &amp; idempotency</text>
    </g>
  </g>
  <path class="flowDash" d="M570 588V486"/>
  <path class="flowDash" d="M869 588V486"/>
  <path class="flowDash" d="M1174 588V486"/>

  <!-- Footer -->
  <path d="M56 790H1744" stroke="#2a3c55"/>
  <text class="small" x="56" y="830">Synthetic data • Placeholder configuration • No production credentials</text>
  <text class="small" x="1744" y="830" text-anchor="end">ORBELION ETL Platform / Public Portfolio</text>
</svg>
