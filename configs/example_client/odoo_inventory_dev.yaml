facts:
- name: fact_inventario
  business_key: inventario_movimiento_id
  columns:
    inventario_movimiento_id: NVARCHAR(100)
    inventario_id: NVARCHAR(100)
    fecha_key: INT
    producto_key: INT
    tipo_movimiento: NVARCHAR(50)
    cantidad: DECIMAL(18,4)
    costo_unitario: DECIMAL(18,4)
    valor: DECIMAL(18,4)
  query: SELECT s.inventario_movimiento_id, s.inventario_id, f.fecha_key, p.producto_key,
    COALESCE(s.tipo_movimiento, CASE WHEN s.cantidad > 0 THEN 'ENTRADA' WHEN s.cantidad
    < 0 THEN 'SALIDA' ELSE 'AJUSTE_VALOR' END) AS tipo_movimiento, ABS(s.cantidad)
    AS cantidad, COALESCE(NULLIF(ABS(s.costo_unitario), 0), CASE WHEN NULLIF(ABS(s.cantidad),
    0) IS NOT NULL AND NULLIF(ABS(s.valor), 0) IS NOT NULL THEN ABS(s.valor) / ABS(s.cantidad)
    END) AS costo_unitario, COALESCE(NULLIF(s.valor, 0), CASE WHEN NULLIF(ABS(s.cantidad),
    0) IS NOT NULL AND NULLIF(ABS(s.costo_unitario), 0) IS NOT NULL THEN ABS(s.cantidad)
    * ABS(s.costo_unitario) END) AS valor FROM dw.stg_inventario s LEFT JOIN dw.dim_fecha f ON s.fecha = f.fecha
