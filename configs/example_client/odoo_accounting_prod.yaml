  query: SELECT s.gasto_id, f.fecha_key, p.proveedor_key, g.gasto_key, mp.metodo_pago_key,
    s.importe, CASE s.tipo_cuenta WHEN 'expense_direct_cost' THEN 'COSTO_VENTA' WHEN
    'expense_depreciation' THEN 'DEPRECIACION' WHEN 'expense' THEN 'GASTO_OPERATIVO'
    ELSE 'OTRO_GASTO' END AS clasificacion_financiera, s.estado_pago FROM dw.stg_gastos
